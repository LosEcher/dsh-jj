name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install jj (musl static binary)
        env:
          JJ_VERSION: 0.39.0
          JJ_SHA256: 8da8d96e9c8696c21ad47847a63d533e249acb0449d9af0f0562b5ea7b024f04
        run: |
          archive="jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/${archive}" \
            --output "/tmp/${archive}"
          echo "${JJ_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          sudo tar -xzf "/tmp/${archive}" -C /usr/local/bin ./jj
          jj --version
      - name: Smoke test against a real jj repo
        run: |
          jj git init /tmp/jj-ci-repo
          JJ_MCP_BIN=$(command -v jj) node test/test-client.mjs /tmp/jj-ci-repo
