# dsh-jj bundle patch: jj (Jujutsu) version control via MCP.
# Install:  dsh plugin --profile web add github:LosEcher/dsh-jj#main
# (new bundle requires a dsh web restart; HMR only covers config edits)
#
# Exposes the local jj CLI as MCP tools mcp__jj__* (jj_status, jj_log,
# jj_diff, jj_describe, jj_new, jj_commit, jj_edit, jj_abandon, jj_undo,
# jj_rebase, jj_fetch, jj_push, jj_bookmark, jj_run).
#
# Requires: jj >= 0.2x on PATH or at JJ_MCP_BIN. The server auto-detects
# common install locations (e.g. /opt/homebrew/bin/jj on macOS) and falls
# back to `jj` on PATH.
#
# Portable command: `jj-mcp` is the package bin entry (created by pnpm in
# the profile's node_modules/.bin when the bundle is installed via
# `dsh plugin add`). If your dsh process PATH does not include that .bin
# directory, override this row in your user patch layer with:
#   - id: mcp-jj
#     config:
#       serverName: jj
#       transport: stdio
#       command: node
#       args: ['/absolute/path/to/dsh-jj/server.mjs']
#       env:
#         JJ_MCP_BIN: '/path/to/jj'
#       failOnStartupError: false
#       toolCallTimeoutMs: 120000
- insert:
    - id: mcp-jj
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: jj
        transport: stdio
        command: jj-mcp
        failOnStartupError: false
        toolCallTimeoutMs: 120000
